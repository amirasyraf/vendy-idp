# Rotate container logs so the access log cannot fill the host disk.
x-logging: &logging
  driver: json-file
  options: { max-size: 20m, max-file: '5' }
services:
  caddy:
    logging: *logging
    image: caddy:2
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      IDP_DOMAIN: ${IDP_DOMAIN:?required}
      IDP_APPS_DOMAIN: apps.${IDP_DOMAIN:?required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backstage]
  backstage:
    logging: *logging
    # Pushed by deploy.sh to the host-local registry below.
    image: localhost:15000/compute-factory-idp:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_OPTIONS: --no-node-snapshot --max-old-space-size=1536
      # Containers: the k3s API on this host and the IDP's service account (cluster-install.sh).
      KUBE_API: https://host.docker.internal:6443
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - ./kube:/kube:ro
    depends_on:
      postgres:
        condition: service_healthy
  # Browser remote desktop for Windows VMs: Backstage connects to guacd on 127.0.0.1:4822, and
  # guacd reaches the VM's RDP port through Backstage's per-session SSH forward on 127.0.0.1.
  # Sharing Backstage's network namespace keeps both loopback-only.
  guacd:
    logging: *logging
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    network_mode: service:backstage
    mem_limit: 1g
    depends_on: [backstage]
  postgres:
    logging: *logging
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: backstage
      POSTGRES_DB: backstage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U backstage -d backstage']
      interval: 5s
      timeout: 5s
      retries: 20
  registry:
    logging: *logging
    image: registry:2
    restart: unless-stopped
    # Loopback only; deploy.sh reaches it through an SSH tunnel.
    ports: ['127.0.0.1:15000:5000']
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
    volumes:
      - registry_data:/var/lib/registry
volumes:
  registry_data:
  postgres_data:
  caddy_data:
  caddy_config:
