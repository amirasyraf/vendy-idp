app:
  baseUrl: https://${IDP_DOMAIN}
computeFactory:
  demoAutomation: true
  mockServiceNowUrl: https://${IDP_DOMAIN}/mock-rest/servicenow
backend:
  baseUrl: https://${IDP_DOMAIN}
  listen: { host: 0.0.0.0, port: 7007 }
  # Exactly one proxy hop (Caddy, which replaces any client X-Forwarded-For), so audit
  # and client-log entries record the real client IP instead of Caddy's container IP.
  trustProxy: 1
  csp:
    connect-src: ["'self'", "https://*.s3.ap-southeast-2.amazonaws.com", "https://*.blob.core.windows.net"]
    img-src: ["'self'", "data:", "blob:"]
  cors:
    origin: https://${IDP_DOMAIN}
  database:
    client: pg
    connection:
      host: postgres
      port: 5432
      user: backstage
      password: ${POSTGRES_PASSWORD}
      database: backstage
  auth:
    externalAccess:
      - type: static
        options:
          token: ${BACKSTAGE_TOKEN}
          subject: compute-factory-workflows
        accessRestrictions:
          - plugin: catalog
          - plugin: vms
auth:
  environment: production
catalog:
  locations:
    - type: file
      target: /app/catalog/org.yaml
    - type: file
      target: /app/catalog/locations.yaml
    - type: file
      target: /app/catalog/templates/ssh-cert/template.yaml
    - type: file
      target: /app/catalog/templates/bucket-request/template.yaml
