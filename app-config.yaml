app:
  title: Vendy
  baseUrl: http://localhost:3000
  packages: all
  extensions:
    - page:home:
        config:
          path: /
    # Light mode only: the Vendy theme replaces theme:app/light.
    - theme:app/dark: false
    # VM pages carry owner, lifecycle and source in their own header; the
    # stock About card is kept for every other entity.
    - entity-card:catalog/about:
        config:
          filter:
            $not:
              kind: resource
              spec.type: vm
    # The template list (/create, reached from Launch) shows only the VM template. Modify (vm-modify) opens prefilled from the VM page and
    # SSH certificate from the VM page and Home; their /create/templates/... URLs still work.
    - sub-page:scaffolder/templates:
        config:
          templateFilter:
            metadata.name: vm-request
organization:
  name: Vendy
computeFactory:
  mockServiceNowUrl: http://localhost:7007/api/mock-rest/servicenow
backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  cors:
    origin: http://localhost:3000
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'
integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}
permission:
  enabled: true
# Resume tasks after a backend restart instead of failing them. The VM actions are
# idempotent per task ID (checkpoints plus idempotent backend endpoints).
scaffolder:
  taskRecovery:
    enabled: true
auth:
  providers:
    password: {}
catalog:
  orphanStrategy: delete
  processingInterval: { seconds: 30 }
  rules:
    - allow: [Component, System, API, Resource, Location, User, Group, Template]
  locations:
    - type: file
      target: ../../catalog/org.yaml
    - type: file
      target: ../../catalog/locations.yaml
    - type: file
      target: ../../catalog/templates/ssh-cert/template.yaml
    - type: file
      target: ../../catalog/templates/bucket-request/template.yaml
